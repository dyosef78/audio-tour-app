# =============================================================================
# Seed/migration drift gate
#
# Three migrations in a row shipped correct SQL with a seed file that had
# silently stopped matching it, and two of the three produced no error anywhere
# - the reset succeeded and the catalogue simply loaded invisible.
#
# This job is the answer: bring up a real stack, apply every migration in order,
# load the seed, and assert as ANON that a complete bundle comes back.
#
# It runs on any change to migrations, seeds or the verifier, which is exactly
# the set of files that can cause the drift.
# =============================================================================

name: Verify database

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'backend/scripts/verify-bundle.ts'
      - '.github/workflows/db-verify.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'backend/scripts/verify-bundle.ts'
      - '.github/workflows/db-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold `supabase start` pulls a lot of images. Generous, but a hang should
    # still fail rather than burn a runner for six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PINNED, not `latest`. Resolving `latest` is an unauthenticated GitHub API
      # call, and on 16 Sep it failed with "rate limit exceeded" before a single
      # check ran (feat/epic-7-routing, 230d4f2). 2.117.0 was `latest` on the
      # last green main run. Bump deliberately, and expect the types step to be
      # the one that notices a generator change.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Starts Postgres, PostGIS, GoTrue, PostgREST and Storage, then applies
      # every migration in order. A migration that cannot apply from scratch
      # fails here - which is the check that the remote `db push` never performs,
      # since it only ever applies the newest file to an existing database.
      - name: Start Supabase
        run: supabase start

      # Migrations, then seed - `db reset` does both, in that order. That
      # ordering is the whole point: it is what exposes a seed which no longer
      # satisfies a constraint the migrations add.
      - name: Reset and seed
        run: supabase db reset

      # `status -o env` emits shell-style KEY="value" lines. Sourced rather than
      # written to GITHUB_ENV because GITHUB_ENV only takes effect in LATER
      # steps, not the one that writes it.
      - name: Verify bundle as anon
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:?supabase status did not report API_URL}"
          export SUPABASE_ANON_KEY="${ANON_KEY:?supabase status did not report ANON_KEY}"
          node backend/scripts/verify-bundle.ts

      # Generated types are committed, and a schema change that does not
      # regenerate them breaks the next person's build rather than this one.
      #
      # COMPARES THE SCHEMA, NOT THE GENERATOR'S BOILERPLATE (TASK-603).
      # The committed file comes from `npm run types:generate`, i.e. --linked,
      # which Supabase's hosted generator produces; this job can only run
      # --local. The two differ in ways that say nothing about the schema, and
      # that alone kept this step red on main from aa20049 onward:
      #   * --linked adds an __InternalSupabase { PostgrestVersion } header that
      #     --local omits, and its value tracks whichever PostgREST built it;
      #   * the generic helpers after the Database type (Tables<>, Enums<>, ...)
      #     are formatted differently between generator versions - parentheses
      #     and a trailing newline.
      # So both files are cut down to the Database type, minus that header, and
      # compared EXACTLY. Every schema, table, view, column, function argument
      # and return type is still diffed. Only generator boilerplate is ignored.
      - name: Types are up to date
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/supabase.ts

          schema_only() {
            awk '/^export type Database = [{]/ { on = 1 } /^type DatabaseWithoutInternals/ { on = 0 } on' "$1" \
              | sed -e '/^  \/\/ Allows to automatically instantiate createClient/d' \
                    -e '/^  \/\/ instead of createClient</d' \
                    -e '/^  __InternalSupabase: {$/,/^  }$/d'
          }

          schema_only /tmp/supabase.ts > /tmp/generated.schema
          schema_only backend/types/supabase.ts > /tmp/committed.schema

          # No vacuous pass: if the generator ever renames these markers, both
          # extracts would come out empty and compare equal.
          for f in /tmp/generated.schema /tmp/committed.schema; do
            if ! grep -q '^  public: {$' "$f"; then
              echo "Could not extract the Database type from $f - update schema_only() in db-verify.yml."
              exit 1
            fi
          done

          if ! diff -u /tmp/committed.schema /tmp/generated.schema; then
            echo "backend/types/supabase.ts is stale. Run: npm run types:generate"
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop
